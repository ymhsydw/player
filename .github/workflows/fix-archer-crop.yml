name: Fix archer sprite crop

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-archer-crop.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fix archer frame slicing directly in server.js
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('server.js')
          s = p.read_text()

          old_frames = "const ARCHER_FRAMES=Array.from({length:4},(_,row)=>Array.from({length:3},(_,col)=>({x:col*128,y:row*128,w:128,h:128})));"
          new_frames = "let ARCHER_FRAMES=null;"
          if old_frames not in s:
              raise SystemExit('ARCHER_FRAMES target not found')
          s = s.replace(old_frames, new_frames, 1)

          old_assets = "try{const mageBase=await PIXI.Assets.load('/mage.png?v=120');const pirateBase=await PIXI.Assets.load('/pirate.png?v=120');const archerBase=await PIXI.Assets.load('/archer.png?v=120');mageTextures=MAGE_FRAMES.map(row=>row.map(f=>new PIXI.Texture(mageBase.baseTexture,new PIXI.Rectangle(f.x,f.y,f.w,f.h))));pirateTextures=PIRATE_FRAMES.map(row=>row.map(f=>new PIXI.Texture(pirateBase.baseTexture,new PIXI.Rectangle(f.x,f.y,f.w,f.h))));archerTextures=ARCHER_FRAMES.map(row=>row.map(f=>new PIXI.Texture(archerBase.baseTexture,new PIXI.Rectangle(f.x,f.y,f.w,f.h))));}catch(err){statusEl.textContent='캐릭터 이미지 로드 실패';}"
          new_assets = "try{const mageBase=await PIXI.Assets.load('/mage.png?v=121');const pirateBase=await PIXI.Assets.load('/pirate.png?v=121');const archerBase=await PIXI.Assets.load('/archer.png?v=121');const archerCellW=archerBase.width/3,archerCellH=archerBase.height/4;ARCHER_FRAMES=Array.from({length:4},(_,row)=>Array.from({length:3},(_,col)=>({x:col*archerCellW,y:row*archerCellH,w:archerCellW,h:archerCellH})));mageTextures=MAGE_FRAMES.map(row=>row.map(f=>new PIXI.Texture(mageBase.baseTexture,new PIXI.Rectangle(f.x,f.y,f.w,f.h))));pirateTextures=PIRATE_FRAMES.map(row=>row.map(f=>new PIXI.Texture(pirateBase.baseTexture,new PIXI.Rectangle(f.x,f.y,f.w,f.h))));archerTextures=ARCHER_FRAMES.map(row=>row.map(f=>new PIXI.Texture(archerBase.baseTexture,new PIXI.Rectangle(f.x,f.y,f.w,f.h))));}catch(err){statusEl.textContent='캐릭터 이미지 로드 실패';}"
          if old_assets not in s:
              raise SystemExit('asset loader target not found')
          s = s.replace(old_assets, new_assets, 1)

          old_scale = "if(p.avatar==='archer'&&archerTextures){c.sprite.texture=archerTextures[row][col];c.sprite.scale.set(1.05);c.sprite.anchor.set(.5,1);}"
          new_scale = "if(p.avatar==='archer'&&archerTextures){c.sprite.texture=archerTextures[row][col];c.sprite.scale.set(.38);c.sprite.anchor.set(.5,1);}"
          if old_scale not in s:
              raise SystemExit('archer scale target not found')
          s = s.replace(old_scale, new_scale, 1)

          p.write_text(s)
          PY
          node --check server.js
      - name: Commit server.js
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.js
          git commit -m 'Fix archer sprite frame cropping'
          git push origin HEAD:main
