name: Apply character skills directly

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply patch directly to server.js
        run: |
          sed -i 's/archer\\.webp/archer.png/g' scripts/apply-character-skills.js
          node scripts/apply-character-skills.js
          node --check server.js
      - name: Commit patched server.js
        run: |
          if git diff --quiet -- server.js; then
            echo 'No server.js changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.js
          git commit -m 'Apply archer and upgraded class skills directly'
          git push origin HEAD:main
