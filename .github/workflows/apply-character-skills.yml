name: Apply character skills directly

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply patch directly to server.js
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('server.js')
          s=p.read_text()
          old="for (const s of querySlimes(fire.x, fire.y, 100)) {\n        const dx = s.x - fire.x, dy = s.y - fire.y, r = s.radius + fire.radius, d2 = dx * dx + dy * dy;"
          new="for (const s of querySlimes(fire.x, fire.y, 100)) {\n        if (!s.alive) continue;\n        const dx = s.x - fire.x, dy = s.y - fire.y, r = s.radius + fire.radius, d2 = dx * dx + dy * dy;"
          if old in s:
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
          sed -i 's/archer\.webp/archer.png/g' scripts/apply-character-skills.js
          node scripts/apply-character-skills.js
          node --check server.js
      - name: Commit patched server.js
        run: |
          if git diff --quiet -- server.js; then
            echo 'No server.js changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.js
          git commit -m 'Apply archer and upgraded class skills directly'
          git push origin HEAD:main
