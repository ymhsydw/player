name: Apply boss event system and mobile fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-boss-event-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch server directly
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('server.js')
          s=p.read_text()
          if '// BOSS_EVENT_V2' in s:
              print('already patched')
          else:
              s=s.replace('// LOGIN_BOARD_PERSISTENCE_V1','// LOGIN_BOARD_PERSISTENCE_V1\n// BOSS_EVENT_V2',1)

              old="""const AVATARS = ['mage', 'pirate', 'archer'];
const NORMAL_SLIMES = 150;
const ELITE_SLIMES = 25;
const MIN_SLIME_SPAWN_DISTANCE = 125;
const SLIME_RESPAWN_MS = 5000;
const BOSS_TARGET = 20;
const BOSS_HP = 1200;
const BOSS_KEEP_NORMAL = 18;
const BOSS_KEEP_ELITE = 4;

const SLIME_AGGRO = 380;
const ELITE_AGGRO = 480;
const BOSS_AGGRO = 700;
const SLIME_CHASE_SPEED = 125;
const ELITE_CHASE_SPEED = 155;
const BOSS_CHASE_SPEED = 118;
const SLIME_DAMAGE = 10;
const ELITE_DAMAGE = 18;
const BOSS_DAMAGE = 30;
const SLIME_ATTACK_COOLDOWN = 900;
const ELITE_ATTACK_COOLDOWN = 780;
const BOSS_ATTACK_COOLDOWN = 700;"""
              new="""const AVATARS = ['mage', 'pirate', 'archer'];
const NORMAL_SLIMES = 110;
const ELITE_SLIMES = 7;
const ELITE_RESPAWN_CHANCE = 0.35;
const MIN_SLIME_SPAWN_DISTANCE = 125;
const SLIME_RESPAWN_MS = 5000;
const BOSS_TARGET = 30;
const HIDDEN_ELITE_TARGET = 20;
const EVENT_WAVE_TARGET = 20;
const EVENT_SAFE_GRACE_MS = 20000;
const MID_BOSS_HP = 520;
const KING_HP = 2400;
const QUEEN_HP = 3900;

const SLIME_AGGRO = 380;
const ELITE_AGGRO = 480;
const MID_BOSS_AGGRO = 760;
const KING_AGGRO = 1500;
const QUEEN_AGGRO = 1750;
const SLIME_CHASE_SPEED = 125;
const ELITE_CHASE_SPEED = 155;
const MID_BOSS_SPEED = 145;
const KING_SPEED = 145;
const QUEEN_SPEED = 178;
const SLIME_DAMAGE = 10;
const ELITE_DAMAGE = 18;
const MID_BOSS_DAMAGE = 24;
const KING_DAMAGE = 36;
const QUEEN_DAMAGE = 44;
const SLIME_ATTACK_COOLDOWN = 900;
const ELITE_ATTACK_COOLDOWN = 780;
const MID_BOSS_ATTACK_COOLDOWN = 720;
const KING_ATTACK_COOLDOWN = 620;
const QUEEN_ATTACK_COOLDOWN = 500;"""
              if old not in s: raise SystemExit('constants block not found')
              s=s.replace(old,new,1)

              old="""let nextEffectId = 1;
let bossProgress = 0;
let bossId = null;"""
              new="""let nextEffectId = 1;
let bossProgress = 0;
let eliteProgress = 0;
let bossId = null;
let bossPhase = 'grind';
let waveKills = 0;
let safeZoneDropAt = 0;"""
              if old not in s: raise SystemExit('boss state block not found')
              s=s.replace(old,new,1)

              old="""function isPlayerSafe(p) {
  if (!p || !p.alive) return true;
  const map = mapSpec(p.map);
  if (map.safeAll) return true;
  return p.map === 'forest' && isPointInForestSafeZone(p.x, p.y);
}"""
              new="""function forestSafeZoneActive(now = Date.now()) {
  if (bossPhase === 'grind') return true;
  return !(safeZoneDropAt && now >= safeZoneDropAt);
}
function isPlayerSafe(p) {
  if (!p || !p.alive) return true;
  const map = mapSpec(p.map);
  if (map.safeAll) return true;
  return p.map === 'forest' && forestSafeZoneActive() && isPointInForestSafeZone(p.x, p.y);
}"""
              if old not in s: raise SystemExit('safe block not found')
              s=s.replace(old,new,1)

              boss_block=r'''function monsterStats(s) {
  if (s.bossType === 'queen') return { aggro: QUEEN_AGGRO, speed: QUEEN_SPEED, damage: QUEEN_DAMAGE, cooldown: QUEEN_ATTACK_COOLDOWN };
  if (s.bossType === 'king') return { aggro: KING_AGGRO, speed: KING_SPEED, damage: KING_DAMAGE, cooldown: KING_ATTACK_COOLDOWN };
  if (s.midBoss) return { aggro: MID_BOSS_AGGRO, speed: MID_BOSS_SPEED, damage: MID_BOSS_DAMAGE, cooldown: MID_BOSS_ATTACK_COOLDOWN };
  if (s.elite) return { aggro: ELITE_AGGRO, speed: ELITE_CHASE_SPEED, damage: ELITE_DAMAGE, cooldown: ELITE_ATTACK_COOLDOWN };
  return { aggro: SLIME_AGGRO, speed: SLIME_CHASE_SPEED, damage: SLIME_DAMAGE, cooldown: SLIME_ATTACK_COOLDOWN };
}
function chooseSlimeDirection(s) {
  const angle = Math.random() * Math.PI * 2;
  const speed = s.boss ? 36 + Math.random() * 18 : s.midBoss ? 52 + Math.random() * 20 : s.elite ? 48 + Math.random() * 26 : 38 + Math.random() * 26;
  s.vx = Math.cos(angle) * speed;
  s.vy = Math.sin(angle) * speed;
  s.changeAt = Date.now() + 1000 + Math.random() * 2400;
  s.targetId = null;
}
function createSlime(elite = false, options = {}) {
  const point = Number.isFinite(options.x) && Number.isFinite(options.y) ? { x: options.x, y: options.y } : forestSpawnPoint(170, MIN_SLIME_SPAWN_DISTANCE);
  const bossType = options.bossType || null;
  const midBoss = !!options.midBoss;
  let radius = elite ? 34 : 24;
  let maxHp = elite ? 180 : 60;
  if (midBoss) { radius = 52; maxHp = MID_BOSS_HP; }
  if (bossType === 'king') { radius = 82; maxHp = KING_HP; }
  if (bossType === 'queen') { radius = 94; maxHp = QUEEN_HP; }
  const s = {
    id: nextSlimeId++, map: 'forest', x: point.x, y: point.y,
    elite, boss: !!bossType, bossType, midBoss, eventMob: !!options.eventMob, marchToCenter: !!options.marchToCenter,
    radius, maxHp, hp: maxHp,
    vx: 0, vy: 0, changeAt: 0, alive: true, respawnAt: 0,
    targetId: null, lastAttackAt: 0, suppressedByBoss: false, active: !!options.eventMob || !!bossType,
    nextPatternAt: Date.now() + 2600, patternIndex: 0, rageUntil: 0, detourUntil: 0, detourSign: Math.random() < 0.5 ? -1 : 1
  };
  chooseSlimeDirection(s);
  slimes.set(s.id, s);
  return s;
}
function spawnBaselineSlimes(clearFirst = false) {
  if (clearFirst) slimes.clear();
  for (let i = 0; i < NORMAL_SLIMES; i++) createSlime(false);
  for (let i = 0; i < ELITE_SLIMES; i++) createSlime(true);
  rebuildSlimeGrid();
}
spawnBaselineSlimes();

function clearMonstersForEvent() {
  for (const s of slimes.values()) { s.alive = false; s.hp = 0; }
  slimes.clear();
  soulFires.clear();
  bossId = null;
  rebuildSlimeGrid();
}
function startInvasionWave() {
  if (bossPhase !== 'grind') return;
  clearMonstersForEvent();
  bossPhase = 'wave';
  waveKills = 0;
  safeZoneDropAt = Date.now() + EVENT_SAFE_GRACE_MS;
  const z = MAPS.forest.safeZone;
  const anchors = [
    { dir:'N', x:z.x, y:360 }, { dir:'E', x:MAPS.forest.width-420, y:z.y },
    { dir:'S', x:z.x, y:MAPS.forest.height-360 }, { dir:'W', x:420, y:z.y }
  ];
  for (const a of anchors) {
    const toCenter = normalize(z.x - a.x, z.y - a.y, 0, 1);
    const px = -toCenter.y, py = toCenter.x;
    createSlime(false, { x:a.x, y:a.y, midBoss:true, eventMob:true, marchToCenter:true });
    const offsets = [-132, -54, 54, 132];
    const elites = [false, true, true, false];
    for (let i = 0; i < 4; i++) createSlime(elites[i], { x:a.x + px * offsets[i], y:a.y + py * offsets[i], eventMob:true, marchToCenter:true });
  }
  rebuildSlimeGrid();
  emitMap('forest', 'bossWaveStarted', { target: EVENT_WAVE_TARGET, safeDropInMs: EVENT_SAFE_GRACE_MS });
}
function startFinalBoss(type) {
  clearMonstersForEvent();
  bossPhase = type;
  if (type === 'queen') safeZoneDropAt = Date.now() + EVENT_SAFE_GRACE_MS;
  else if (!safeZoneDropAt) safeZoneDropAt = Date.now() + EVENT_SAFE_GRACE_MS;
  const z = MAPS.forest.safeZone;
  const s = createSlime(false, { x:z.x, y:520, bossType:type, eventMob:true });
  bossId = s.id;
  rebuildSlimeGrid();
  emitMap('forest', 'bossSpawned', { x:s.x, y:s.y, map:'forest', type });
}
function finishBossEvent(now, type) {
  clearMonstersForEvent();
  bossPhase = 'grind';
  bossProgress = 0;
  eliteProgress = 0;
  waveKills = 0;
  safeZoneDropAt = 0;
  spawnBaselineSlimes();
  emitMap('forest', 'bossDefeated', { type });
}
function respawnSlime(s) {
  if (s.boss || s.eventMob || bossPhase !== 'grind' || s.suppressedByBoss) return;
  if (s.elite && Math.random() > ELITE_RESPAWN_CHANCE) {
    s.respawnAt = Date.now() + 7000 + Math.random() * 9000;
    return;
  }
  const point = forestSpawnPoint(170, MIN_SLIME_SPAWN_DISTANCE);
  s.x = point.x; s.y = point.y; s.hp = s.maxHp; s.alive = true; s.respawnAt = 0;
  s.lastAttackAt = 0; s.active = false; chooseSlimeDirection(s);
}
function addBossProgress(s) {
  if (bossPhase !== 'grind') return;
  const gain = s.elite ? 2 : 1;
  bossProgress += gain;
  if (s.elite) eliteProgress += 2;
  if (eliteProgress >= HIDDEN_ELITE_TARGET && bossProgress < BOSS_TARGET) {
    startFinalBoss('queen');
    return;
  }
  if (bossProgress >= BOSS_TARGET) startInvasionWave();
}
function killSlime(s, now) {
  if (!s.alive) return;
  if (s.bossType === 'king' || s.bossType === 'queen') {
    const type = s.bossType;
    s.alive = false; s.hp = 0; slimes.delete(s.id);
    finishBossEvent(now, type);
    return;
  }
  if (bossPhase === 'wave' && s.eventMob) {
    s.alive = false; s.hp = 0; slimes.delete(s.id); waveKills++;
    rebuildSlimeGrid();
    emitMap('forest', 'waveProgress', { kills:waveKills, target:EVENT_WAVE_TARGET });
    if (waveKills >= EVENT_WAVE_TARGET) startFinalBoss('king');
    return;
  }
  if (bossPhase !== 'grind') {
    s.alive = false; s.hp = 0; slimes.delete(s.id); return;
  }
  s.alive = false; s.hp = 0; s.targetId = null; s.vx = 0; s.vy = 0; s.active = false;
  s.respawnAt = now + (s.elite ? SLIME_RESPAWN_MS * 1.8 : SLIME_RESPAWN_MS);
  addBossProgress(s);
}
'''
              pattern=r"function monsterStats\(s\) \{.*?\nfunction socketForPlayer\(id\)"
