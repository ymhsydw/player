              s=s.replace("function constrainSlimeOutsideSafeZone(s) {\n  const z = MAPS.forest.safeZone;","function constrainSlimeOutsideSafeZone(s) {\n  if (!forestSafeZoneActive()) return;\n  const z = MAPS.forest.safeZone;",1)

              ai_block=r'''function bossAreaAttack(s, radius, damage, type, now) {
  emitMap('forest', 'combatEffect', { type, id:nextEffectId++, x:s.x, y:s.y, radius, life:0.7 });
  for (const p of players.values()) {
    if (!p.alive || p.map !== 'forest') continue;
    if (Math.hypot(p.x - s.x, p.y - s.y) <= radius + PLAYER_RADIUS) damagePlayer(p, damage, now, 'monster');
  }
}
function runBossSpecial(s, now) {
  if (!s.bossType || now < s.nextPatternAt) return;
  s.patternIndex = (s.patternIndex + 1) % (s.bossType === 'queen' ? 4 : 3);
  if (s.bossType === 'king') {
    if (s.patternIndex === 0) bossAreaAttack(s, 265, 30, 'bossSlam', now);
    else if (s.patternIndex === 1) { s.rageUntil = now + 2200; emitMap('forest', 'combatEffect', { type:'bossRage', id:nextEffectId++, x:s.x, y:s.y, radius:170, life:1.0 }); }
    else bossAreaAttack(s, 430, 20, 'bossWave', now);
    s.nextPatternAt = now + 4100;
  } else {
    if (s.patternIndex === 0) bossAreaAttack(s, 320, 40, 'bossSlam', now);
    else if (s.patternIndex === 1) bossAreaAttack(s, 540, 30, 'bossWave', now);
    else if (s.patternIndex === 2) { s.rageUntil = now + 3200; emitMap('forest', 'combatEffect', { type:'bossRage', id:nextEffectId++, x:s.x, y:s.y, radius:230, life:1.2 }); }
    else bossAreaAttack(s, 700, 24, 'queenPulse', now);
    s.nextPatternAt = now + 3200;
  }
}
function updateMonsterAI(now) {
  for (const s of slimes.values()) {
    if (!s.alive) continue;
    if (s.bossType) runBossSpecial(s, now);
    const invasionMarch = bossPhase === 'wave' && s.eventMob && s.marchToCenter;
    if (invasionMarch) {
      s.active = true;
      const z = MAPS.forest.safeZone;
      const dx = z.x - s.x, dy = z.y - s.y, dist = Math.max(0.001, Math.hypot(dx, dy));
      if (dist > 175 || forestSafeZoneActive(now)) {
        const stats = monsterStats(s);
        let ax = dx / dist, ay = dy / dist;
        if (now < s.detourUntil) {
          const side = s.detourSign || 1;
          const tx = -ay * side, ty = ax * side;
          ax = ax * 0.35 + tx * 0.94; ay = ay * 0.35 + ty * 0.94;
          const nn = normalize(ax, ay, dx / dist, dy / dist); ax = nn.x; ay = nn.y;
        }
        s.vx = ax * stats.speed; s.vy = ay * stats.speed; s.targetId = null; s.changeAt = now + 300;
        continue;
      }
    }
    const awakePlayer = s.boss ? nearestForestPlayer(s, 99999, false) : nearestForestPlayer(s, MONSTER_ACTIVE_RADIUS, false);
    if (!awakePlayer) {
      s.active = false; s.targetId = null; s.vx = 0; s.vy = 0;
      continue;
    }
    const wasActive = s.active;
    s.active = true;
    const stats = monsterStats(s);
    const target = nearestForestPlayer(s, stats.aggro, true);
    if (!target) {
      if (!wasActive || now >= s.changeAt || s.targetId !== null) chooseSlimeDirection(s);
      continue;
    }
    s.targetId = target.id;
    const dx = target.x - s.x, dy = target.y - s.y, dist = Math.max(0.001, Math.hypot(dx, dy));
    const attackRange = s.radius + PLAYER_RADIUS + (s.boss ? 30 : s.midBoss ? 22 : s.elite ? 18 : 12);
    if (dist <= attackRange) {
      s.vx = 0; s.vy = 0;
      if (now - s.lastAttackAt >= stats.cooldown) {
        s.lastAttackAt = now;
        const bonus = now < s.rageUntil ? (s.bossType === 'queen' ? 12 : 8) : 0;
        if (damagePlayer(target, stats.damage + bonus, now, 'monster')) emitMap('forest', 'combatEffect', { type:'monsterHit', id:nextEffectId++, x1:s.x, y1:s.y, x2:target.x, y2:target.y, life:0.22 });
      }
      continue;
    }
    const a = normalize(dx, dy);
    const rageScale = now < s.rageUntil ? (s.bossType === 'queen' ? 1.85 : 1.65) : 1;
    const speed = stats.speed * rageScale;
    const avoided = steerAwayFromSafeZone(s, a.x * speed, a.y * speed, speed);
    s.vx = avoided.vx; s.vy = avoided.vy; s.changeAt = now + 450;
  }
}
'''
