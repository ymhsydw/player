              new_ser = "return { id: p.id, nickname: p.nickname, map: p.map, x: p.x, y: p.y, direction: p.direction, moving: p.moving, avatar: p.avatar, hp: p.hp, maxHp: p.maxHp, alive: p.alive, ghostShip: p.ghostShipUntil > Date.now(), ghostDirX: p.ghostDirX, ghostDirY: p.ghostDirY };"
