name: Apply login board directly

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-login-board.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply patch
        run: |
          python patch-login.py
          node --check server.js
      - name: Commit result
        run: |
          rm -f patch-login.py .github/workflows/apply-login-board.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js package.json patch-login.py .github/workflows/apply-login-board.yml
          git commit -m "Add login board and playtime persistence"
          git push origin HEAD:main
