registerBtn.addEventListener('click',()=>socket.emit('register',{nickname:authNickname.value,password:authPassword.value}));
logoutBtn.addEventListener('click',()=>socket.emit('logout'));
boardClose.addEventListener('click',()=>{boardPanel.style.display='none';});
boardWriteBtn.addEventListener('click',()=>socket.emit('createBoardPost',{title:boardTitleInput.value,content:boardContentInput.value}));
socket.on('authResult',d=>{authMessage.textContent=d.message||'';if(d.ok){profileLoggedIn=!!d.loggedIn;nicknameText.textContent=d.nickname||'Guest';playtimeText.textContent=formatPlaytime(d.playSeconds||0);accountBtn.textContent=profileLoggedIn?'계정':'로그인';logoutBtn.style.display=profileLoggedIn?'inline-block':'none';authPanel.style.display='none';}});
socket.on('boardData',d=>{renderBoard(d.posts);boardMessage.textContent=d.persistent?'':'현재 DB 미연결: 서버 재시작 시 글이 초기화됩니다.';boardPanel.style.display='block';if(currentBoard)currentBoard.hasNew=false;if(boardNoticeText)boardNoticeText.visible=false;});
socket.on('boardPostResult',d=>{boardMessage.textContent=d.message||'';if(d.ok){boardTitleInput.value='';boardContentInput.value='';socket.emit('openBoard');}});
socket.on('boardError',d=>{boardMessage.textContent=d.message||'게시판 오류';});
socket.on('boardNewPost',d=>{if(currentMap==='village'&&boardPanel.style.display!=='block'){if(!currentBoard)currentBoard={x:BOARD_CLIENT.x,y:BOARD_CLIENT.y,hasNew:true};else currentBoard.hasNew=true;if(boardNoticeText)boardNoticeText.visible=true;}});
'''
